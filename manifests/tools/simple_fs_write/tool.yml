kind: Tool
name: simple_fs_write
version: "1.0"
summary: "Write text-body content to a file"
description: |
  Convenience text-body variant of fs_write. Use scalar attrs for path/append
  and place file content directly inside the action body.
category: filesystem
tags: [fs, write, file, io, create, text-body]
input_schema:
  type: object
  required: [path, content]
  properties:
    path:
      type: string
      description: "File path to write"
    content:
      type: string
      description: "Content to write; may come from the action text body"
    append:
      type: boolean
      description: "Append instead of overwrite"
      default: false
output_schema:
  type: object
  properties:
    success:
      type: boolean
    path:
      type: string
    bytes_written:
      type: integer
implementation:
  type: builtin
  runtime: native
  input_type: text
  text_param: content
examples:
  - description: "Write a Python file using text-body input"
    params:
      path: "tmp_2.py"
      content: "print('hello')\n"
