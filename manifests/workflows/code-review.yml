kind: Workflow
version: "1.0"
name: "code-review"
summary: "Review a source file for issues — grep for TODOs, count lines, check imports"

description: >
  Multi-step code review workflow. Takes a target file via input.target,
  counts lines, searches for TODOs/FIXMEs/HACKs/XXXs, reads the source,
  and writes a review summary.

steps:
  - id: measure
    type: tool
    name: "Count lines"
    tool: exec
    params:
      command: "wc -l ${input.target}"
    on_error: abort

  - id: find_todos
    type: tool
    name: "Search for TODOs and FIXMEs"
    tool: grep
    params:
      pattern: "TODO|FIXME|HACK|XXX"
      path: "${input.target}"
    on_error: skip

  - id: read_source
    type: tool
    name: "Read the source file"
    tool: fs_read
    params:
      path: "${input.target}"
    on_error: abort

  - id: summarise
    type: tool
    name: "Write review summary"
    tool: fs_write
    params:
      path: "/tmp/code-review-${input.target}.md"
      content: "# Code Review: ${input.target}\n\nLines: ${measure.result}\nTODOs: ${find_todos.count}\n\nReview generated by MK3 workflow."
    on_error: skip

import:
  tools:
    - builtin/exec
    - builtin/grep
    - tools/fs_read
    - tools/fs_write

tags:
  - workflow
  - review
  - code-quality
