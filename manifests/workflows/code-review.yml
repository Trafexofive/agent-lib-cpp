kind: Workflow
version: "1.0"
name: "code-review"
summary: "Review a source file for issues — grep for TODOs, count lines, check imports"

description: >
  Multi-step code review workflow. Takes a target file via input.target,
  counts lines, searches for TODOs/FIXMEs/HACKs/XXXs, reads the source,
  and prints a review summary.

steps:
  - id: measure
    type: tool
    name: "Count lines"
    tool: exec
    params:
      command: "wc -l ${input.target}"
    on_error: abort

  - id: find_todos
    type: tool
    name: "Search for TODOs and FIXMEs"
    tool: grep
    params:
      pattern: "TODO|FIXME|HACK|XXX"
      path: "${input.target}"
    on_error: skip

  - id: read_source
    type: tool
    name: "Read the source file"
    tool: exec
    params:
      command: "sed -n '1,240p' ${input.target}"
    on_error: abort

  - id: summarise
    type: tool
    name: "Print review summary"
    tool: exec
    params:
      command: "printf '%s\n' '# Code Review: ${input.target}' '' 'Lines: ${measure.result}' 'TODOs: ${find_todos.count}' '' 'Review generated by MK3 workflow.'"
    on_error: skip

import:
  tools:
    - builtin/exec
    - builtin/grep

tags:
  - workflow
  - review
  - code-quality
