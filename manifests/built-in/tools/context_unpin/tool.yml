kind: Tool
name: context_unpin
version: "1.0"
summary: "Remove a pinned file from agent context"
category: context
tags: [context, unpin, release, memory]

description: |
  Release a sticky pin so the file leaves future system context.

  WHEN: after the task no longer needs a pinned spine file, or context is tight.
  WHY: reclaim tokens; prevent stale pins from lying about current code.
  HOW: pass the same path used in context_pin.
  ANTI: unpin is not required for peeks (they auto-evict). Don't unpin mid-reasoning if you still need the contract.
  TURN ECONOMY: free; call when done with a pin.
input_schema:
  type: object
  required: [path]
  properties:
    path:
      type: string
      description: "File path to unpin"

output_schema:
  type: object
  properties:
    success: { type: boolean }
    path: { type: string }
    message: { type: string }

examples:
  - description: "Unpin a config file no longer needed"
    params:
      path: "manifests/agents/default/agent.yml"
