kind: Tool
name: artifact
version: "1.0"
summary: "Project-local versioned artifact store"
description: |
  Project-local versioned artifact store under .cortex/artifacts.

  WHEN: durable plans, reports, handoffs that must survive compaction — not ephemeral peeks.
  WHY: out-of-context persistence without a relic service.
  HOW: op put/get/list/search/delete with namespace+key; versioned automatically.
  ANTI: not a replacement for fs_write of production code; not for huge binaries.
  TURN ECONOMY: store summaries/plans once; don't dump full tool logs every turn.
category: storage
tags: [artifact, storage, persistence, handoff]
input_schema:
  type: object
  properties:
    op:
      type: string
      enum: [put, create, store, get, read, list, search, delete, remove, stats]
      default: put
    namespace:
      type: string
      description: "Namespace path segment"
      default: default
    key:
      type: string
      description: "Artifact key/name"
    name:
      type: string
      description: "Alias for key"
    content:
      description: "String or JSON content for put/store"
    content_type:
      type: string
      description: "MIME/content type"
    tags:
      type: array
      items: {type: string}
    tag:
      type: string
      description: "Single tag filter or tag to store"
    metadata:
      type: object
      description: "Extra metadata stored with artifact version"
    version:
      type: integer
      description: "Specific version for get/delete; latest when omitted"
    prefix:
      type: string
      description: "List key prefix filter"
    query:
      type: string
      description: "Search query across key, metadata, tags, and content"
    limit:
      type: integer
      default: 100
    root:
      type: string
      description: "Storage root override"
      default: .cortex/artifacts
output_schema:
  type: object
  properties:
    success: {type: boolean}
    artifact: {type: object}
    artifacts: {type: array}
    content: {}
    path: {type: string}
    count: {type: integer}
    output: {type: string}
examples:
  - description: "Store a report"
    params:
      op: put
      namespace: reports
      key: build-summary
      content: "Tests passed"
      tags: [build, test]
  - description: "Read latest artifact"
    params: {op: get, namespace: reports, key: build-summary}
  - description: "Search artifacts"
    params: {op: search, namespace: reports, query: "Tests"}
