kind: Tool
name: exec
version: "2.0"
summary: "Run a shell command with timeout and bounded output"
description: |
  Executes a command through /bin/sh -c. Use only when a more specific builtin
  cannot do the job. Supports cwd, hard timeout, output byte limit, and reports
  exit_code/timed_out/elapsed_ms/truncated.
category: runtime
tags: [exec, shell, command, process]
input_schema:
  type: object
  required: [command]
  properties:
    command:
      type: string
      description: "Shell command to run"
    cwd:
      type: string
      description: "Working directory for the command"
    timeout:
      type: integer
      description: "Timeout in seconds, clamped to 1..600"
      default: 30
    max_bytes:
      type: integer
      description: "Maximum captured stdout+stderr bytes"
      default: 524288
output_schema:
  type: object
  properties:
    success: {type: boolean}
    exit_code: {type: integer}
    timed_out: {type: boolean}
    elapsed_ms: {type: integer}
    truncated: {type: boolean}
    bytes: {type: integer}
    output: {type: string}
examples:
  - description: "Run tests"
    params: {command: "make test", timeout: 120, max_bytes: 200000}
  - description: "Run command in a directory"
    params: {command: "git status --short", cwd: "/workspace/project"}
