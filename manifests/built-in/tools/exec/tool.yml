kind: Tool
name: exec
version: "3.0"
summary: "Run shell commands or direct argv processes with bounded I/O"
description: |
  Bounded process runner (shell or argv) with stdout/stderr caps and timeout.

  WHEN: build/test/git/toolchain operations that no named tool covers.
  WHY: full power, but easy to misuse and expensive in tokens/time.
  HOW: prefer argv when no shell features needed; set cwd/timeout; read exit_code and stderr on failure; quote commands clearly.
  ANTI: do NOT use for list/grep/cat/write when list/grep/fs_read/fs_write exist. Don't run unbounded find/rg without caps. No destructive git unless ordered.
  TURN ECONOMY: last resort among tools; one purposeful command > fishing expeditions.
category: runtime
tags: [exec, shell, command, process, argv]
input_schema:
  type: object
  properties:
    command:
      type: string
      description: "Shell command for shell=true. Aliases: cmd, input."
    cmd:
      type: string
      description: "Alias for command"
    input:
      type: string
      description: "Alias for command"
    shell:
      type: boolean
      description: "Run through /bin/sh -c. Defaults true unless argv is provided."
    argv:
      type: array
      items: {type: string}
      description: "Direct executable argv for shell=false, e.g. ['git','status','--short']"
    cwd:
      type: string
      description: "Working directory; must already exist"
    stdin:
      type: string
      description: "Text sent to process stdin"
    env:
      type: object
      additionalProperties: {type: string}
      description: "Environment overrides/additions"
    clear_env:
      type: boolean
      description: "Start with empty environment before applying env"
      default: false
    timeout:
      type: integer
      description: "Timeout in seconds, clamped to 1..600"
      default: 30
    timeout_ms:
      type: integer
      description: "Timeout in milliseconds, overrides timeout"
    max_bytes:
      type: integer
      description: "Default cap for stdout/stderr bytes"
      default: 524288
    max_stdout:
      type: integer
      description: "Stdout byte cap"
    max_stderr:
      type: integer
      description: "Stderr byte cap"
output_schema:
  type: object
  properties:
    success: {type: boolean}
    exit_code: {type: integer}
    signal: {type: integer}
    timed_out: {type: boolean}
    elapsed_ms: {type: integer}
    stdout_truncated: {type: boolean}
    stderr_truncated: {type: boolean}
    truncated: {type: boolean}
    stdout_bytes: {type: integer}
    stderr_bytes: {type: integer}
    bytes: {type: integer}
    stdout: {type: string}
    stderr: {type: string}
    output: {type: string}
    error: {type: string}
examples:
  - description: "Run a shell command"
    params: {command: "make test", timeout: 120, max_bytes: 200000}
  - description: "Run direct argv without shell quoting"
    params: {shell: false, argv: ["git", "status", "--short"], cwd: "/workspace/project"}
  - description: "Pass stdin and env"
    params:
      shell: false
      argv: ["python3", "-c", "import os,sys; print(os.getenv('NAME')); print(sys.stdin.read())"]
      stdin: "hello"
      env: {NAME: "mk3"}
