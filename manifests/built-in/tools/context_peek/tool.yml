kind: Tool
name: context_peek
version: "1.0"
summary: "Peek at a file in context for N cycles, then auto-evict"
category: context
tags: [context, peek, ephemeral, temporary]

description: |
  Ephemeral file truth: inject a file into context for N cycles, then auto-evict.

  WHEN: one-off or short-lived reads (headers, logs, dumps, intermediate outputs) you may need for a few turns without sticky bloat.
  WHY: best lever for high sources-of-truth with low context cost — content dies when TTL expires.
  HOW: batch multiple peeks in the same generation when you know the paths; set cycles deliberately (1 default for single-shot, 2–3 for a short edit loop). Prefer over context_pin for anything not needed for the whole session.
  ANTI: do not peek giant binaries; do not use as a substitute for grep when you only need a symbol hit; do not pin and peek the same file.
  TURN ECONOMY: path is required; batch peeks same turn; avoid one-file-per-turn thrash.
input_schema:
  type: object
  required: [path]
  properties:
    path:
      type: string
      description: "File path to peek at"
    cycles:
      type: integer
      description: "Number of iterations to keep in context (default 1)"
      default: 1

output_schema:
  type: object
  properties:
    success: { type: boolean }
    path: { type: string }
    size: { type: integer }
    cycles: { type: integer }
    mode: { type: string }

examples:
  - description: "Peek at a build output for 2 cycles"
    params:
      path: "build/output.log"
      cycles: 2
