kind: Tool
name: context_pin
version: "1.0"
summary: "Pin a file into persistent agent context"
category: context
tags: [context, pin, retain, memory]

description: |
  Sticky file truth: keep a file in context every turn until unpinned.

  WHEN: durable spine docs you will reference across many turns (API schema, core header, agent contract).
  WHY: avoids re-reading the same load-bearing file; expensive if overused.
  HOW: pin only small/medium files that define contracts; unpin when the task moves on.
  ANTI: never pin huge logs, build outputs, or one-off dumps — use context_peek. Never pin "just in case."
  TURN ECONOMY: prefer peek with TTL; pin budget should stay tiny (usually 0–3 files).
input_schema:
  type: object
  required: [path]
  properties:
    path:
      type: string
      description: "File path to pin"

output_schema:
  type: object
  properties:
    success: { type: boolean }
    path: { type: string }
    size: { type: integer }
    mode: { type: string }

examples:
  - description: "Pin a project's config file"
    params:
      path: "manifests/agents/default/agent.yml"
