kind: Tool
name: grep
version: "2.0"
summary: "Search files with regex or literal matching and structured results"
description: |
  Content search (regex or literal) with structured matches.

  WHEN: find symbols, strings, call sites, TODOs before opening files.
  WHY: narrows candidate set so fs_read/peek stay targeted.
  HOW: set path+glob when known; use literal=true for plain strings; bound max_matches; then read only hot hits.
  ANTI: not a replacement for list (layout) or exec rg with exotic flags unless needed; don't dump unbounded matches into context — tighten pattern.
  TURN ECONOMY: grep → selective fs_read/peek in the same or next turn; never grep then ignore results.
category: filesystem
tags: [grep, search, find, regex]
input_schema:
  type: object
  required: [pattern]
  properties:
    pattern:
      type: string
      description: "Regex or literal text to search for"
    path:
      type: string
      description: "File or directory path"
      default: "."
    glob:
      type: string
      description: "Filename glob filter"
      default: "*"
    pattern_glob:
      type: string
      description: "Alias for glob"
    literal:
      type: boolean
      description: "Treat pattern as literal text instead of regex"
      default: false
    ignore_case:
      type: boolean
      description: "Case-insensitive search"
      default: false
    context:
      type: integer
      description: "Context lines before/after each match, clamped to 0..20"
      default: 0
    max_matches:
      type: integer
      description: "Maximum match/context items returned, clamped to 1..5000"
      default: 100
output_schema:
  type: object
  properties:
    success: {type: boolean}
    path: {type: string}
    pattern: {type: string}
    matches: {type: integer}
    truncated: {type: boolean}
    items: {type: array}
    results: {type: string}
    output: {type: string}
examples:
  - description: "Find TODO comments"
    params: {pattern: "TODO", path: "src", glob: "*.cpp", literal: true}
  - description: "Regex search with context"
    params: {pattern: "class\\s+Agent", path: "src", glob: "*.hpp", context: 2}
