kind: Tool
name: list
version: "2.0"
summary: "List files and directories with structured entries"
description: |
  Directory/file listing with structured entries (layout, not content).

  WHEN: discover shape of a tree, confirm a path exists, choose what to grep/read next.
  WHY: cheaper and safer than exec ls/find; structured results.
  HOW: start non-recursive; add pattern/glob and recursive only when needed; respect max_entries.
  ANTI: not for reading file bodies (fs_read/peek); not for content search (grep). Don't recursive-list huge monorepos unfiltered.
  TURN ECONOMY: one well-scoped list beats many blind lists; then grep/read.
category: filesystem
tags: [list, ls, files, directory]
input_schema:
  type: object
  properties:
    path:
      type: string
      description: "File or directory path to list"
      default: "."
    recursive:
      type: boolean
      description: "Recurse into subdirectories"
      default: false
    pattern:
      type: string
      description: "Filename glob filter, e.g. '*.cpp'"
      default: "*"
    glob:
      type: string
      description: "Alias for pattern"
    type:
      type: string
      enum: [all, file, dir, directory, symlink]
      default: all
    relative:
      type: boolean
      description: "Return paths relative to the listed root"
      default: true
    max_entries:
      type: integer
      description: "Maximum entries to return, clamped to 1..5000"
      default: 200
output_schema:
  type: object
  properties:
    success: {type: boolean}
    path: {type: string}
    count: {type: integer}
    truncated: {type: boolean}
    entries: {type: array}
    results: {type: string}
    output: {type: string}
examples:
  - description: "List current directory"
    params: {path: ".", max_entries: 100}
  - description: "Find C++ files recursively"
    params: {path: "src", recursive: true, pattern: "*.cpp", type: file}
