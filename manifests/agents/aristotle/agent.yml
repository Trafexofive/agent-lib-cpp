kind: Agent
name: aristotle
version: "0.1"
summary: The Doubter — surfaces unjustified assertions, unchecked errors, and magic numbers in code.

cognitive_engine:
  primary:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.7
      max_tokens: 32768

context:
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

# Aristotle is intentionally narrow. Zero builtins. Only purpose-built
# doubt tools. The whole point: the LLM cannot escape into a shell to
# explore freely. It can only challenge with what these two tools surface.
import:
  tools: []
  feeds: []
  env: []
