kind: Agent
name: coder-proto
version: "1.2"
summary: Implementation coordinator — own the diff, verify, report. Evidence-first via discovery + reader.
category: agent
tags: [agent, launchable, prod, coding, proto]

cognitive_engine:
  primary:
    # provider: openai-codex
    # model: gpt-5.5
    # provider: opencode-go
    # model: deepseek-v4-pro
    provider: x-ai
    model: grok-4.5
    # provider: nvidia
    # model: minimaxai/minimax-m3
    parameters:
      temperature: 0.4
      max_tokens: 65536
  fallback:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.25
      max_tokens: 65536

context:
  harness: ../../harness/default.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 20
  history_cap: 80
  mode: normal
  # dev_mode: true
  # CORTEX_DEV_MODE=1 for dumps without editing this file
  subagents:
    persistence: session

import:
  tools:
    - exec
    - grep
    - list
    - fs_read
    - fs_write
    - json
    - ask_tool
    - web_fetch
  feeds:
    - working_directory
  agents:
    - reader
    - discovery
  env: []
