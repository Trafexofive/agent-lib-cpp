kind: Agent
name: reader
version: "1.1"
summary: Read-only task scout — paths, symbols, and evidence for a concrete coding task.

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.4
      max_tokens: 32768
  fallback:
    provider: deepseek
    model: deepseek-v4-flash
    parameters:
      temperature: 0.3
      max_tokens: 32768

context:
  harness: ../../../harness/default.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 16
  history_cap: 48
  mode: normal
  # dev_mode off for prod; CORTEX_DEV_MODE=1 if needed

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
  feeds: []
  agents: []
  env: []
