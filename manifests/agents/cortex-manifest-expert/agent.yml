kind: Agent
name: cortex-manifest-expert
version: "1.0"
summary: Manifest schema expert — author, review, and audit tool/feed/relic/workflow/agent manifests.

cognitive_engine:
  primary:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.3
      max_tokens: 65536

context:
  system: ../../prompts/manifest-expert.md
  persona: ../../persona/manifest-expert.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

import:
  tools:
    - exec
    - grep
    - list
    - fs_read
    - fs_write
    - json
    - sleep
    - context_peek
  feeds: []
  env: []
