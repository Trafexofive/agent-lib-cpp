kind: Agent
name: planner
version: "1.0"
summary: Pure decomposer — ordered work packages, zero tools.

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.2
      max_tokens: 16384
  fallback:
    provider: deepseek
    model: deepseek-v4-flash
    parameters:
      temperature: 0.2
      max_tokens: 16384

context:
  harness: ../../../../harness/small.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 3
  history_cap: 20
  mode: normal

import:
  tools: []
  feeds: []
  env: []
