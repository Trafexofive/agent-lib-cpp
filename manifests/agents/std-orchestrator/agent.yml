kind: Agent
name: std-orchestrator
version: "1.0"
summary: Standard control-plane orchestrator — plans, routes, synthesizes. Specialists do the work. Planning and orchestrating long running tasks
category: agent
tags: [agent, launchable, prod]

cognitive_engine:
  primary:
    provider: nvidia
    model: z-ai/glm-5.2
    parameters:
      temperature: 1
      max_tokens: 32768
  fallback:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.8
      max_tokens: 32768

context:
  harness: ../../harness/medium.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 14
  history_cap: 70
  mode: normal
  subagents:
    persistence: session

import:
  tools:
    - ask_tool
  feeds:
    - working_directory
    - system_clock
  agents:
    - planner
    - researcher
    - skeptic
    - coder
  workflows:
    - ./workflows/route.yml
  env: []
