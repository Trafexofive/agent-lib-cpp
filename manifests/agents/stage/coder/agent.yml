kind: Agent
name: coder
version: "1.0.0"
summary: Design-owner daily driver — architecture, taste, intent; delegates implementation to coder-worker.
description: |
  Parent coding module. Holds design/architecture inclinations and product judgment.
  Does not thrash the tree: implementation writes go through coder-worker.
  Sensors/gates live under the worker; you brief, constrain, accept or reject.
category: agent
tags: [agent, launchable, prod, coding, design, architecture, daily-driver]

cognitive_engine:
  primary:
    provider: x-ai
    model: grok-4.6
    # provider: opencode-go
    # model: deepseek-v4-pro
    parameters:
      temperature: 0.8
      max_tokens: 65536
  fallback:
    provider: opencode-go
    model: minimax-m3
    parameters:
      temperature: 0.75
      max_tokens: 65536

context:
  harness: ../../harness/default.md
  system: ./system.md
  persona: ./persona.md

runtime:
  max_iterations: 400
  # history_cap: 2400  # now trim.tail.cap
  mode: normal
  subagents:
    persistence: session
  # action_timeout_sec: 180 # project_test / make can exceed default 30s

  prompt_building:
    runtime_capabilities:
      input_schemas: true
      return_schemas: false
      usage_examples: true

  trim:
    enabled: true
    tail:
      cap: 2400
      every_turns: 15
      # every_turns: 1            # reclamp every prompt
      # every_turns: 0            # compute once, freeze forever
      # cap: 0                    # fall back to runtime.history_cap alias
    trigger:
      context_tokens: 72k
      context_pct: 0.80
      turns: 8
      model_context_tokens: 500000
    cooldown:
      min_turns: 1
      min_seconds: 0
    policy:
      default: { keep: tail, keep_last: 8, truncate_chars: 800 }
      tags:
        user:     { keep: all }
        parent:   { keep: all }
        thought:  { keep: none }
        action:   { keep: tail, keep_last: 8, truncate_chars: 800 }
        result:   { keep: tail, keep_last: 8, truncate_chars: 600, on_error: keep }
        response: { keep: tail, keep_last: 3, truncate_chars: 2400 }
        agent:    { keep: tail, keep_last: 8, truncate_chars: 2000 }
        system:   { keep: tail, keep_last: 8, truncate_chars: 800 }
      never_drop: [pin, open_ask]
    # overrides:
    #   tags:
    #     result: { keep_last: 12 }
    #   never_drop: [pin, open_ask]
  compaction:
    enabled: true
    # none | light | balanced | aggressive | archive_first
    profile: light

    trigger:
      context_tokens: 50k # also: context_window
      context_pct: 0.65 # needs model_context_tokens
      turns: 15 # user turns since last compact
      model_context_tokens: 500000 # window size for context_pct

    cooldown:
      min_turns: 2
      min_seconds: 30 # wall-clock gate between compacts

    # Full policy (merges on top of profile). keep: all | tail | none
    # policy:
    #   default: { keep: tail, keep_last: 6, truncate_chars: 2000 }
    #   tags:
    #     user: { keep: all }
    #     parent: { keep: all }
    #     thought: { keep: none } # strip <thought> from Agent lines
    #     action: { keep: tail, keep_last: 12, truncate_chars: 1200 }
    #     result:
    #       { keep: tail, keep_last: 12, truncate_chars: 1000, on_error: keep }
    #     response: { keep: tail, keep_last: 4, truncate_chars: 4000 }
    #     agent: { keep: tail, keep_last: 12, truncate_chars: 4000 }
    #     system: { keep: tail, keep_last: 12, truncate_chars: 1200 }
    #   never_drop: [pin, open_ask]

    # Optional surgical deltas without rewriting full policy:
    # overrides:
    #   tags:
    #     result: { keep_last: 20 }
    #   never_drop: [pin, open_ask]

    # output:
    #   # drop | summarize_rules | summarize_llm (llm → rules for now)
    #   mode: summarize_rules
    #   archive:
    #     enabled: true
    #     # file | artifact | none  (both file/artifact → .cortex/compact/<session>/)
    #     sink: file
    #     format: markdown # markdown | jsonl

    # subagents:
    #   inherit: true # child agents get parent compaction cfg
    #   child_before_return: true # compact child history before folding up

  # Optional: nest retry here (top-level retry: still accepted).
  # retry:
  #   empty_response_max_retries: 8
  #   empty_response_initial_backoff_ms: 1500
  #   empty_response_max_backoff_ms: 45000
  #   empty_response_backoff_multiplier: 1.8
  #   retry_on_finish_reason_length: true
  #   retry_on_finish_reason_content_filter: true

import:
  tools:
    - list
    - grep
    - fs_read
    - json
    - sleep
    - ask_tool
    - context_peek
    - web_fetch
    # Read-only git pulse — writes stay on coder-worker
    - ./agents/coder-worker/tools/git_status/tool.yml
    - ./agents/coder-worker/tools/git_diff/tool.yml
    # No fs_write / exec / project_test here — worker owns the implement path
  feeds:
    - working_directory
    - ./agents/coder-worker/feeds/repo_pulse/feed.yml
  agents:
    - ./agents/coder-worker/agent.yml
  skills:
    - evidence-first
    - architecture-first
    - taste-and-clarity
    - verify-before-accept
  files:
    - ./prompts/brief-worker.md
    - ./prompts/accept-gate.md
  env: []
