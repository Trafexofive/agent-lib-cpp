kind: Agent
name: tester
version: "1.0"
summary: Verification specialist — plans and runs the narrowest checks that can fail.

cognitive_engine:
  primary:
    provider: xai
    model: grok-4.20-0309-non-reasoning
    parameters:
      temperature: 0.5
      max_tokens: 32768

context:
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 8
  history_cap: 50
  mode: normal

import:
  tools:
    - list
    - grep
    - fs_read
    - exec
    - json
  feeds: []
  env: []
