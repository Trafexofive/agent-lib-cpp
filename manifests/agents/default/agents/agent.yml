kind: Agent
name: default-sub-agent
version: "2.0"
summary: Primary general RO sub-agent —  NO exec, NO fs_write
category: agent
tags: [sub-agent, launchable, prod]

cognitive_engine:
  primary:
    # provider: opencode-go
    # model: deepseek-v4-pro
    provider: deepseek
    model: deepseek-v4-flash
    # provider: opencode
    # model: deepseek-v4-flash-free
    parameters:
      temperature: 0.55
      max_tokens: 65536
    thinking: true # enables provider test-time compute / reasoning tokens
  # Used once on hard 403/RegionError/transient net after primary retries.
  fallback:
    provider: opencode
    model: deepseek-v4-flash-free

context:
  harness: ../../../harness/default.md
  system: ../../../system/default.md
  persona: ../../../persona/default.md
  # Operator ground-truth (USER.md). Injected as <user_context> in the system block.
  # user: ./USER.md

runtime:
  max_iterations: 180
  history_cap: 1700
  # Recompute the dumb history_cap tail at most every N user turns (1=every turn, 0=freeze).
  max_turns_per_cycle: 15
  mode: normal
  # dev_mode: true

  # Prompt assembly knobs (also accepted top-level as legacy prompt_building:).
  prompt_building:
    runtime_capabilities:
      input_schemas: true # full JSON input schemas (default off = cards)
      return_schemas: false # controls <returns>
      usage_examples: true # controls <examples>

  # ── Context economy (nested under runtime) ─────────────────────────────
  # Canonical: docs/manifests/compaction.md
  # Top-level compaction: still accepted as a legacy alias.
  compaction:
    enabled: true
    # none | light | balanced | aggressive | archive_first
    profile: balanced

    trigger:
      context_tokens: 60k # also: context_window
      context_pct: 0.65 # needs model_context_tokens
      turns: 15 # user turns since last compact
      model_context_tokens: 128000 # window size for context_pct

    cooldown:
      min_turns: 2
      min_seconds: 30 # wall-clock gate between compacts

    # Full policy (merges on top of profile). keep: all | tail | none
    policy:
      default: { keep: tail, keep_last: 6, truncate_chars: 2000 }
      tags:
        user: { keep: all }
        parent: { keep: all }
        thought: { keep: none } # strip <thought> from Agent lines
        action: { keep: tail, keep_last: 12, truncate_chars: 1200 }
        result:
          { keep: tail, keep_last: 12, truncate_chars: 1000, on_error: keep }
        response: { keep: tail, keep_last: 4, truncate_chars: 4000 }
        agent: { keep: tail, keep_last: 12, truncate_chars: 4000 }
        system: { keep: tail, keep_last: 12, truncate_chars: 1200 }
      never_drop: [pin, open_ask]

    # Optional surgical deltas without rewriting full policy:
    # overrides:
    #   tags:
    #     result: { keep_last: 20 }
    #   never_drop: [pin, open_ask]

    output:
      # drop | summarize_rules | summarize_llm (llm → rules for now)
      mode: summarize_rules
      archive:
        enabled: true
        # file | artifact | none  (both file/artifact → .cortex/compact/<session>/)
        sink: file
        format: markdown # markdown | jsonl

    # subagents:
    #   inherit: true # child agents get parent compaction cfg
    #   child_before_return: true # compact child history before folding up

  # Optional: nest retry here (top-level retry: still accepted).
  # retry:
  #   empty_response_max_retries: 8
  #   empty_response_initial_backoff_ms: 1500
  #   empty_response_max_backoff_ms: 45000
  #   empty_response_backoff_multiplier: 1.8
  #   retry_on_finish_reason_length: true
  #   retry_on_finish_reason_content_filter: true

import:
  tools:
    # - exec
    - grep
    - list
    - fs_read
    - ../../../tools/tree/tool.yml
    - ../../../tools/squeezer/tool.yml
    # - ../../../playground/diagram-junky/manifests/tools/diagram-render/tool.yml
    # - fs_write
    - json
    - web_fetch
    - sleep
    - artifact
    # - context_pin
    - context_peek
    # - context_unpin
    - ask_tool
  # Built-in relics: none. Runtime checkpointing belongs in the core runtime,
  # not as stdlib relic manifests.
  feeds: []
  env: []
