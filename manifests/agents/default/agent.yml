kind: Agent
name: default
version: "2.0"
summary: Primary agent — opencode-go primary, openrouter fallback

cognitive_engine:
  primary:
    provider: opencode-go
    model: deepseek-v4-flash
    parameters:
      temperature: 0.7
      max_tokens: 65536
  fallback:
    provider: openrouter
    model: nex-2

context:
  harness: ../../harness/default.md
  system: ../../system/default.md
  persona: ../../persona/default.md

prompt_building:
  runtime_capabilities:
    return_schemas: false  # controls <returns>
    usage_examples: false  # controls <examples>

import:
  tools:
    - exec
    - grep
    - list
    - fs_read
    - fs_write
    - json
    - web_fetch
    - sleep
    - context_pin
    - context_peek
    - context_unpin
    - ask_tool
  # Built-in relics: none. Runtime checkpointing belongs in the core runtime,
  # not as stdlib relic manifests.
  feeds: []
  env: []
