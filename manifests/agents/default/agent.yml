kind: Agent
name: default
version: "2.0"
summary: Primary agent — persona-driven, protocol in harness

cognitive_engine:
  primary:
    provider: openrouter
    model: nex-2
    parameters:
      temperature: 0.7
      max_tokens: 65536

persona:
  agent: ./persona.md

import:
  tools:
    - exec
    - grep
    - list
    - context_pin
    - context_peek
    - context_unpin
    - ask_tool
  relics:
    - session_journal
    - state_checkpoint
  feeds: []
  env: []
