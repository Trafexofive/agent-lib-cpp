kind: Agent
name: brainstormer
version: "1.0"
summary: Ideation coordinator — expands options, grounds them, kills weak ones, ships a ranked proposal.
category: agent
tags: [agent, ideation, creative, coordinator, launchable, prod]

cognitive_engine:
  primary:
    provider: xai
    model: grok-4.5
    parameters:
      temperature: 0.9
      max_tokens: 32768
  fallback:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.7
      max_tokens: 32768

context:
  harness: ../../harness/default.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 12
  history_cap: 80
  mode: normal
  subagents:
    persistence: session

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
    - web_fetch
    - ask_tool
    - json
  feeds:
    - working_directory
  agents:
    - discovery
    - critic
  env: []
