kind: Agent
name: brainstormer
version: "1.0"
summary: Ideation coordinator — expands options, grounds them, kills weak ones, ships a ranked proposal.
category: agent
tags: [agent, ideation, creative, coordinator, launchable, prod]

cognitive_engine:
  primary:
    provider: opencode-go
    model: deepseek-v4-pro
    thinking_level: minimal
    parameters:
      temperature: 0.36
      max_tokens: 32768
  fallback:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.7
      max_tokens: 32768

context:
  harness: ../../harness/default.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    input_schemas: true
    return_schemas: true
    usage_examples: true

runtime:
  max_iterations: 12
  history_cap: 1180
  mode: normal
  subagents:
    persistence: session

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
    - web_fetch
    - ask_tool
    - json
  feeds:
    - working_directory
  agents:
    - discovery
  env: []
