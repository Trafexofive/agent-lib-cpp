kind: Agent
name: critic
version: "1.0"
summary: Adversarial idea filter — kill criteria, failure modes, cheap falsifiers.
category: specialist
tags: [agent, nested, critic, adversarial, parent:brainstormer]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.35
      max_tokens: 16384
  fallback:
    provider: deepseek
    model: deepseek-v4-flash
    parameters:
      temperature: 0.3
      max_tokens: 16384

context:
  harness: ../../../../harness/small.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 4
  history_cap: 30
  mode: normal

import:
  tools:
    - fs_read
    - grep
    - list
  feeds: []
  env: []
