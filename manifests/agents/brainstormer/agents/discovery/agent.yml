kind: Agent
name: discovery
version: "1.0"

summary: RO Specialized Discovery/Recon Agent.
category: specialist
tags: [sub-agent, nested, discovery, research, recon, web]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.55
      max_tokens: 24576
  fallback:
    provider: deepseek
    model: deepseek-v4-flash
    parameters:
      temperature: 0.3
      max_tokens: 24576

context:
  harness: ../../../../harness/default.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    input_schemas: true
    return_schemas: true
    usage_examples: true

runtime:
  max_iterations: 1000
  history_cap: 500
  mode: normal

import:
  tools:
    # file-system inspection (read-only)
    - list
    - grep
    - tree
    - squeezer
    - fs_read
    - context_peek
    # web / visual / structured discovery (custom, local, read-only)
    - ./tools/web_search/tool.yml
    - ./tools/web_open_url/tool.yml
    - ./tools/search_image_by_text/tool.yml
    - ./tools/search_image_by_image/tool.yml
    - ./tools/get_data_source_desc/tool.yml
    - ./tools/get_data_source/tool.yml
    - ./tools/ipython/tool.yml
  feeds:
    - working_directory
  env: []
