kind: Workflow
version: "1.0"
name: implement
summary: "Scout spine — pulse → map → hits (parent writes after)"
description: |
  Rails for evidence gathering before the parent implements.
  Parent (coder) performs fs_write itself after these steps — do NOT re-enter coder.
steps:
  - id: pulse
    type: tool
    name: "Repo pulse"
    tool: git_status
    params: {short: true}
    on_error: skip

  - id: scout_map
    type: agent
    name: "Discovery if area unknown"
    agent: discovery
    params:
      instruction: "Map structure/conventions/risk for the task area. CONFIRMED vs INFERRED. Task: ${input.task}"
    on_error: skip

  - id: scout_hits
    type: agent
    name: "Reader for task files"
    agent: reader
    params:
      instruction: "Task-scoped evidence for: ${input.task}. Paths + why. Map: ${scout_map.output}"
    on_error: skip

import:
  agents: [discovery, reader]
  tools: [git_status]
tags: [coder, implement, scout]
