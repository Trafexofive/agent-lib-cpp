kind: Agent
name: reviewer
version: "1.0"
summary: Diff/risk pass — severity findings only; no edits.
category: agent
tags: [specialist, coding, review]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.25
      max_tokens: 8192

context:
  harness: ../../../harness/small.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    input_schemas: false
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 8
  history_cap: 16
  mode: normal

import:
  tools:
    - fs_read
    - grep
    - list
    - ../../tools/git_diff/tool.yml
    - ../../tools/git_status/tool.yml
  feeds: []
  agents: []
  env: []
