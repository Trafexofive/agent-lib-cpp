kind: Agent
name: reader
version: "1.0"
summary: Task-scoped read-only scout — paths, symbols, evidence table.
category: agent
tags: [specialist, coding, scout, read-only]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.35
      max_tokens: 16384

context:
  harness: ../../../harness/small.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    input_schemas: false
    return_schemas: false
    usage_examples: false

runtime:
  max_iterations: 10
  history_cap: 20
  mode: normal

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
  skills:
    - ../../skills/evidence-first
  feeds: []
  agents: []
  env: []
