kind: Agent
name: discovery
version: "1.0"
summary: Area mapper — structure, conventions, risk, open questions (read-mostly).
category: agent
tags: [specialist, coding, map, read-mostly]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.35
      max_tokens: 16384
  # fallback paid only when free is dead — avoid default 402 burn
  # fallback:
  #   provider: deepseek
  #   model: deepseek-v4-flash

context:
  harness: ../../../harness/small.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    input_schemas: false
    return_schemas: false
    usage_examples: false

runtime:
  # Slim scout — map fast or hand back; never 200-iter tourism
  max_iterations: 12
  history_cap: 24
  mode: normal

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
    - ../../tools/git_status/tool.yml
    - ../../tools/build_detect/tool.yml
  feeds:
    - working_directory
  skills:
    - ../../skills/evidence-first
    - ../../skills/smallest-diff
  agents: []
  env: []
