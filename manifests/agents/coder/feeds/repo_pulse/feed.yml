kind: Feed
name: repo_pulse
version: "1.0"
summary: "Branch, HEAD, and dirty pulse for the coding worktree"
description: |
  Ambient git pulse. Complements working_directory with branch/dirty/porcelain.
category: coding
tags: [git, ambient, coding]
runtime: bash
entrypoint: poll.sh
allow_empty: false
output_schema:
  type: object
  properties:
    branch: {type: string}
    commit: {type: string}
    dirty: {type: boolean}
    porcelain: {type: string}
