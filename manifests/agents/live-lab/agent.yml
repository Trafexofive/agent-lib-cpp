kind: Agent
name: live-lab
version: "1.0.0"
summary: Live harness/manifest lab — opencode-go DeepSeek v4 primary, MiniMax M3 fallback.
description: |
  Disposable daily-driver for protocol, fallback, ask_tool, sibling agents, and
  incomplete-gen recovery. Not a product agent. Do not import this from coder.
category: agent
tags: [agent, launchable, lab, harness, live-test]

cognitive_engine:
  primary:
    provider: opencode-go
    model: deepseek-v4-pro
    thinking: true
    thinking_level: medium
    parameters:
      temperature: 0.4
      max_tokens: 32768
  fallback:
    provider: opencode-go
    model: minimax-m3
    thinking: true
    thinking_level: low
    parameters:
      temperature: 0.4
      max_tokens: 32768

context:
  harness: ../../harness/default.md
  system: ./system.md
  persona: ./persona.md

runtime:
  max_iterations: 24
  mode: normal
  subagents:
    persistence: session
  prompt_building:
    runtime_capabilities:
      input_schemas: true
      return_schemas: false
      usage_examples: true
  # 0-LLM ctx-clean. Owns the dumb tail (was history_cap).
  trim:
    enabled: true
    tail:
      cap: 800
      every_turns: 8
      # every_turns: 1            # reclamp every prompt
      # every_turns: 0            # compute once, freeze forever
      # cap: 0                    # fall back to runtime.history_cap alias
    trigger:
      context_tokens: 72k
      turns: 8
      # context_pct: 0.80
      # model_context_tokens: 128000
    # cooldown:
    #   min_turns: 1
    #   min_seconds: 0
    policy:
      # default: { keep: tail, keep_last: 8, truncate_chars: 800 }
      tags:
        thought:  { keep: none }
        action:   { keep: tail, keep_last: 8, truncate_chars: 800 }
        result:   { keep: tail, keep_last: 8, truncate_chars: 600 }
        response: { keep: tail, keep_last: 3, truncate_chars: 2400 }
        # user:     { keep: all }
        # parent:   { keep: all }
        # agent:    { keep: tail, keep_last: 8, truncate_chars: 2000 }
        # system:   { keep: tail, keep_last: 8, truncate_chars: 800 }
      # never_drop: [pin, open_ask]
    # overrides:
    #   tags:
    #     result: { keep_last: 12 }
  compaction:
    enabled: false
    profile: light

import:
  tools:
    - list
    - grep
    - fs_read
    - json
    - sleep
    - ask_tool
    - artifact
    - context_peek
    - web_fetch
  feeds:
    - working_directory
  agents:
    - ./agents/echo-worker/agent.yml
    - ./agents/probe-worker/agent.yml
  files:
    - ./prompts/live-script.md
  env: []
