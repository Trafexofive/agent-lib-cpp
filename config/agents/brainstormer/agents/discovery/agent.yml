kind: Agent
name: discovery
version: "1.0"

summary: Read-only landscape scout — prior art, constraints, repo/web evidence for ideation.
category: specialist
tags: [agent, nested, discovery, research, parent:brainstormer]

cognitive_engine:
  primary:
    provider: opencode
    model: deepseek-v4-flash-free
    parameters:
      temperature: 0.55
      max_tokens: 24576
  fallback:
    provider: deepseek
    model: deepseek-v4-flash
    parameters:
      temperature: 0.3
      max_tokens: 24576

context:
  harness: ../../../../harness/big.md
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: true
    usage_examples: true

runtime:
  max_iterations: 118
  history_cap: 140
  mode: normal

import:
  tools:
    - list
    - grep
    - fs_read
    - context_peek
    - web_fetch
  feeds:
    - working_directory
  env: []
