kind: Agent
name: osint_recon_expert
version: "0.1.0"
summary: "OSINT & passive recon specialist — footprinting, asset/identity enumeration from public sources, zero active scanning"

cognitive_engine:
  primary:
    provider: xai
    model: grok-4.5
    parameters:
      temperature: 0.1
      max_tokens: 32768

context:
  harness: ../../../../../manifests/harness/small.md
  system: ./system-prompts/system.md
  persona: ./system-prompts/persona.md

runtime:
  max_iterations: 12
  history_cap: 60
  max_turns_per_cycle: 15
  action_timeout_sec: 60

prompt_building:
  runtime_capabilities:
    input_schemas:  true
    return_schemas: false
    usage_examples: false

sandbox:
  mode: process
  network: out
  readonly: false
  # Passive by design: web_fetch + curl/dig/whois only. No active scanner.
  allowed_commands: [bash, python3, curl, jq, dig, whois, ls, cat, grep, head, tail, find]
  allowed_hosts: ["*"]        # public OSINT surfaces
  bind:
    - ../../ctx:/workspace/ctx

compaction:
  enabled: true
  profile: balanced
  trigger: { context_tokens: 40000, context_pct: 0.65, turns: 15 }
  output:
    mode: summarize_rules
    archive: { enabled: true, sink: file, format: markdown }

import:
  tools: [ask_tool, exec, fs_read, fs_write, grep, list, json, web_fetch, context_pin, context_peek]
  files:
    - ../../prompts/finding-contract.md
    - ../../prompts/engagement-rules.md
  env: []
