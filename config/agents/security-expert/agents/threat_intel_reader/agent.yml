kind: Agent
name: threat_intel_reader
version: "0.1.0"
summary: "Threat intelligence reader — advisories, CVEs, IOCs, threat landscape context for engagement targets"

cognitive_engine:
  primary:
    provider: xai
    model: grok-4.5
    parameters:
      temperature: 0.1
      max_tokens: 32768

context:
  harness: ../../../../../manifests/harness/small.md
  system: ./system-prompts/system.md
  persona: ./system-prompts/persona.md

runtime:
  max_iterations: 12
  history_cap: 60
  max_turns_per_cycle: 15
  action_timeout_sec: 60

prompt_building:
  runtime_capabilities:
    input_schemas:  true
    return_schemas: false
    usage_examples: false

sandbox:
  mode: process
  network: out
  readonly: false
  allowed_commands: [bash, python3, curl, jq, ls, cat, grep, head, tail, find]
  allowed_hosts: ["*"]        # advisory/CVE/IOC sources
  bind:
    - ../../ctx:/workspace/ctx

compaction:
  enabled: true
  profile: balanced
  trigger: { context_tokens: 40000, context_pct: 0.65, turns: 15 }
  output:
    mode: summarize_rules
    archive: { enabled: true, sink: file, format: markdown }

import:
  tools: [ask_tool, exec, fs_read, grep, list, json, web_fetch, context_pin, context_peek]
  files:
    - ../../prompts/finding-contract.md
    - ../../prompts/engagement-rules.md
  env: []
