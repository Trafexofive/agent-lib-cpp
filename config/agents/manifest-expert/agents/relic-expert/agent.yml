kind: Agent
name: relic-expert
version: "1.0"
summary: "Relic manifest specialist — designs, implements, and validates Relic manifests (managed services)"

cognitive_engine:
  primary:
    # provider: opencode
    # model: nemotron-3-ultra-free

    provider: xai
    model: grok-4.5
    parameters:
      temperature: 0.2
      max_tokens: 32768

context:
  system: ./system-prompts/relic-expert.md
  persona: ./system-prompts/relic-expert.md

sandbox:
  mode: process
  allowed_commands: [python3, bash, cat, ls, grep, head, tail, find, yaml, yq, docker, docker-compose]
  allowed_paths: ["./", "../../harness/", "../../manifests/"]
  allowed_hosts: ["localhost"]
  readonly: false
  network: out

prompt_building:
  runtime_capabilities:
    return_schemas: true
    usage_examples: true

runtime:
  max_iterations: 6
  history_cap: 50

import:
  tools:
    - exec
    - list
    - fs_read
    - fs_write
    - json
    - grep
  feeds: []
  env:
    - MANIFEST_BASE_URL=file:///home/mlamkadm/repos/active/agent-lib-cpp
