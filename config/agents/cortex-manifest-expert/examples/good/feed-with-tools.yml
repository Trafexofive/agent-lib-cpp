kind: Feed
name: my_stateful_feed
version: "1.0"
summary: "Feed with state file + two tools. Tests the manifest-tools path."

description: |
  Polls state.json + log.txt and surfaces them as ambient context.
  Two tools let the model (or the user) read or modify the state.

runtime: python3
entrypoint: ./poll.py

tools:
  - name: status
    description: Read the current state.json contents.
    runtime: python3
    entrypoint: ./tool_status.py
  - name: set
    description: Write a key/value pair into state.json. Params: {key, value, note?}.
    runtime: python3
    entrypoint: ./tool_set.py
