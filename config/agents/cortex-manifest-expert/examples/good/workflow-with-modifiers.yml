kind: Workflow
version: "1.0"
name: plan_and_execute
summary: "Plan via a sub-agent (ephemeral, with trace), then execute the plan."

import:
  tools: [exec, fs_read]

steps:
  - id: plan
    type: agent
    agent: planner
    params:
      instruction: "Outline a 3-step plan for the user's request."
      ephemeral: true          # do not persist the planning session
      dump_context: true       # return the planning trace for the final report

  - id: report
    type: tool
    tool: fs_read
    params:
      path: "./plan.md"
      # Variable resolution: ${plan.output} contains the planner's response.
      # The dispatch happens after the plan step completes.
    depends_on: [plan]
