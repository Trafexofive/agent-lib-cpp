kind: Tool
name: my_compiled_tool
version: "1.0"
summary: "Compiled C++ tool with build hook."

description: |
  Runs a compiled C++ binary. Build runs lazily on first invocation;
  if the binary already exists at `build.output`, the build is skipped.

runtime: binary
entrypoint: ./bin/mybinary
build:
  command: "make"
  cwd: "./"
  output: "./bin/mybinary"

params:
  properties:
    input:
      type: string
      required: true
  required: [input]
