kind: Agent
name: my_minimal_agent
version: "1.0"
summary: "Smallest valid agent manifest."

cognitive_engine:
  primary:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.7
      max_tokens: 65536

# context.harness / context.system / context.persona are all optional.
# When omitted, the global defaults (manifests/harness/default.md, etc.) are used.
# Uncomment to override:
# context:
#   harness: ../../harness/default.md
#   system: ../../system/default.md
#   persona: ../../persona/default.md

import:
  tools: [exec, fs_read, list, grep, json]
  feeds: []
  env: []
  agents: [default]
