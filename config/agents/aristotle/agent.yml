kind: Agent
name: aristotle
version: "0.1"
summary: The Doubter — surfaces unjustified assertions, unchecked errors, and magic numbers in code.

cognitive_engine:
  primary:
    provider: deepseek
    model: deepseek-v4-pro
    parameters:
      temperature: 0.7
      max_tokens: 32768

context:
  system: ./system.md
  persona: ./persona.md

prompt_building:
  runtime_capabilities:
    return_schemas: false
    usage_examples: false

# Aristotle is intentionally narrow. ZERO builtins. The only tool is
# the local script tool `challenge`, which lives in ./tools/challenge/
# — same manifest module, not a global builtin. The narrowness is
# two-fold: (1) only one tool, and (2) that tool is local to this
# agent. Other agents can't use it because it's not registered in
# the global ToolRegistry.
import:
  tools:
    - ./tools/challenge/tool.yml
  feeds: []
  env: []
