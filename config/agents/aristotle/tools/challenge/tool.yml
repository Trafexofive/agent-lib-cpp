kind: Tool
name: challenge
version: "0.1"
summary: "Find challengeable items in a file: unjustified assertions, unchecked errors, magic numbers, TODOs."

description: |
  Reads a file and returns a structured list of things a skeptic would doubt:
  unjustified assertions in comments, unchecked errors, magic numbers, TODO/FIXME
  markers, and suspicious patterns ("always", "never", "obviously", "safe",
  "guaranteed", "impossible"). The output is JSON: a list of findings with
  line number, severity, kind, and a verbatim evidence quote from the code.

  This is NOT a builtin. It is a local script tool that lives in aristotle's
  manifest module (`config/agents/aristotle/tools/challenge/`). It is not
  registered in the global ToolRegistry; only the aristotle agent can call it.

category: analysis
tags: [doubt, review, skeptic, static-analysis]
input_schema:
  type: object
  required: [path]
  properties:
    path:
      type: string
      description: "File to challenge (absolute or relative to cwd)"
    max_findings:
      type: integer
      description: "Cap findings returned (default 50)"
      default: 50

runtime:
  language: python3
  entrypoint: ./challenge.py
  timeout_sec: 30
