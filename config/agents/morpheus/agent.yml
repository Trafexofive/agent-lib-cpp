kind: Agent
name: Morpheus
version: "2.0"
summary: The Father Of all agents — Daily Driver

cognitive_engine:
  # will use more powerful models later
  primary:
    # provider: openrouter
    # model: minimax/minimax-m3
    # provider: deepseek
    # model: deepseek-v4-pro
    provider: openai-codex
    model: gpt-5.5
    # model: z-ai/glm-5.2
    # model: cohere/north-mini-code:free
    parameters:
      temperature: 0.8
      max_tokens: 65536
  thinking: true
  fallback:
    provider: deepseek
    model: deepseek-v4-pro
    # provider: openrouter
    # model: nex-2

prompt_building:
  runtime_capabilities:
    return_schemas: false # controls <returns>
    usage_examples: false # controls <examples>

runtime:
  max_iterations: 30 # every tool call AND OR user query
  history_cap: 40 # for now this is simple but it will tie in with the context management later
  max_cycle: 3 # when the LLM doesnt want to stop or when it forgets final=true the harness 'continues', those are cycles
  ## Next ones have yet to come:
  #agency: base | low | high | autonomous
  # compacting:
    
  

setup: "./setup/base/action_calls.protocol" # execute protocol action calls first thing and fill up the context, this is good for making sure even dumber models dont fail tool calling but also very good for narrowing down and helping in domain specific usecases.
  

import:
  tools:
    - exec
    - grep
    - list
    - fs_read
    - fs_write
    - json
    - web_fetch
    - sleep
    # - context_pin
    - context_peek
    # - context_unpin
    - ask_tool
  # Built-in relics: none. Runtime checkpointing belongs in the core runtime,
  # not as stdlib relic manifests.
  feeds:
    - ./poc/tools/morpheus_dashboard/feed.yml
  env: []
  agents:
    - default # manifests/ global
    - ../cortex-manifest-expert/agent.yml # config/ path-scoped
