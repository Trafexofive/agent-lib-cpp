kind: Relic
version: "0.1"
name: diagram_workspace
summary: "Managed local diagram document workspace for diagram-junky agents."
mode: managed
port: 8127
health_path: /health
compose_file: docker-compose.yml
project_name: diagram-junky-workspace

description: >
  Starter managed relic for storing and retrieving diagram.document.v0 payloads
  while prototyping the future TUI canvas/backend boundary. This is intentionally
  project-local and not promoted to stdlib.

service_type: storage

interface:
  type: rest_api
  base_url: "http://localhost:8127"

endpoints:
  - name: health
    method: GET
    path: /health
    description: "Service health check."
  - name: put
    method: POST
    path: /put
    description: "Store a diagram document by id. Body: {id?, document}."
  - name: get
    method: POST
    path: /get
    description: "Fetch a diagram document. Body: {id}."
  - name: list
    method: POST
    path: /list
    description: "List stored diagram ids. Body may be empty."
  - name: delete
    method: POST
    path: /delete
    description: "Delete a stored diagram. Body: {id}."
  - name: workspace_create
    method: POST
    path: /workspace/create
    description: "Create/update a workspace. Body: {workspace, title?}."
  - name: workspace_list
    method: POST
    path: /workspace/list
    description: "List workspaces. Body may be empty."
  - name: project_create
    method: POST
    path: /project/create
    description: "Create/update a project. Body: {workspace, project, title?}."
  - name: project_list
    method: POST
    path: /project/list
    description: "List projects in a workspace. Body: {workspace}."
  - name: project_copy
    method: POST
    path: /project/copy
    description: "Copy a diagram into a project. Body: {workspace, project, id?, document|source_path}."
  - name: project_diagrams
    method: POST
    path: /project/diagrams
    description: "List diagrams in a project. Body: {workspace, project}."

tags:
  - diagram-junky
  - diagrams
  - playground
  - managed-relic
