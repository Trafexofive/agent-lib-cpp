kind: Agent
name: diagram-junky
version: "0.1"
summary: "Starter agent for diagram-junky playground — diagram render, inspect, validate, and workspace storage."

cognitive_engine:
  primary:
    provider: opencode-go
    model: deepseek-v4-flash
    parameters:
      temperature: 0.7
      max_tokens: 32768

persona:
  agent: ./system-prompts/agent.md

context:
  harness: ../../../harness/default.md
  system: ../../../system/default.md

import:
  tools:
    - ../../tools/diagram-render/tool.yml
    - exec
    - grep
    - list
  relics:
    - ../../relics/diagram-workspace/relic.yml
